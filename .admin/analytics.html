<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard | Navneet Mallick</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #070b1f;
      --bg-secondary: #0a0e27;
      --card-bg: rgba(20, 27, 58, 0.7);
      --card-hover: rgba(20, 27, 58, 0.9);
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.2);
      --secondary: #8b5cf6;
      --tertiary: #f59e0b;
      --success: #22c55e;
      --danger: #ff4444;
      --text: #eaf2ff;
      --text-dim: rgba(234, 242, 255, 0.6);
      --border: rgba(0, 229, 255, 0.2);
      --border-light: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* --- Login --- */
    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 40px rgba(0,229,255,0.1);
      margin-top: 10vh;
      animation: fadeIn 0.6s ease-out;
    }

    .login-container.hidden { display: none; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .login-icon { font-size: 3rem; color: var(--accent); text-align: center; margin-bottom: 20px; }
    .login-title { font-size: 2rem; margin-bottom: 10px; color: var(--accent); text-align: center; font-weight: 700; letter-spacing: -0.5px; }
    .login-subtitle { font-size: 0.9rem; color: var(--text-dim); text-align: center; margin-bottom: 35px; }

    .form-group { margin-bottom: 25px; }
    .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .form-group input {
      width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 12px; color: #fff; font-size: 16px; transition: all 0.3s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px rgba(0,229,255,0.2); }

    .login-btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--secondary));
      border: none; border-radius: 12px; color: #000; font-weight: 700; font-size: 16px; cursor: pointer;
      transition: all 0.3s; box-shadow: 0 10px 20px rgba(0,229,255,0.2);
    }
    .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,229,255,0.4); }

    .error-message { color: var(--danger); font-size: 0.85rem; margin-top: 15px; text-align: center; display: none; animation: shake 0.3s; }
    .error-message.show { display: block; }

    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* --- Dashboard --- */
    .dashboard-container { display: none; width: 100%; max-width: 1400px; animation: fadeIn 0.6s ease-out; }
    .dashboard-container.visible { display: block; }

    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
      padding-bottom: 25px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 20px;
    }
    .dashboard-title { font-size: 2.2rem; color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn {
      padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.9rem;
      border: none;
    }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: rgba(0,229,255,0.1); border-color: var(--accent); transform: translateY(-2px); }
    .btn-danger { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: var(--danger); }
    .btn-danger:hover { background: rgba(255,68,68,0.2); border-color: var(--danger); }

    /* Stats Grid */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px;
    }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px;
      backdrop-filter: blur(10px); display: flex; flex-direction: column; transition: all 0.3s;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.1), transparent);
      transition: left 0.5s;
    }
    .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); background: var(--card-hover); }
    .stat-card:hover::before { left: 100%; }
    .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 600; }
    .stat-value { font-size: 2.4rem; font-weight: 700; color: var(--accent); }
    .stat-change { font-size: 0.8rem; color: var(--success); margin-top: 8px; }

    /* Charts Row */
    .charts-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 40px; }
    .chart-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px;
      backdrop-filter: blur(10px); height: 420px; transition: all 0.3s;
    }
    .chart-card:hover { border-color: var(--accent); background: var(--card-hover); }
    .chart-title { font-size: 1.1rem; color: var(--accent); margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

    /* Tables */
    .content-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 40px; transition: all 0.3s; }
    .content-box:hover { border-color: var(--accent); background: var(--card-hover); }
    .box-header { padding: 22px 28px; background: rgba(0,229,255,0.05); border-bottom: 1px solid var(--border); font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { padding: 16px 28px; text-align: left; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); font-weight: 600; }
    td { padding: 16px 28px; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(0,229,255,0.03); }

    .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; background: rgba(0,229,255,0.1); color: var(--accent); display: inline-block; }
    .badge-purple { background: rgba(139, 92, 246, 0.1); color: #a78bfa; }
    .badge-success { background: rgba(34, 197, 94, 0.1); color: var(--success); }
    .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--tertiary); }

    .empty-state { text-align: center; padding: 80px 40px; color: var(--text-dim); }
    .empty-state i { font-size: 4rem; margin-bottom: 20px; opacity: 0.3; }
    .empty-state p { font-size: 1.1rem; }

    .footer-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; flex-wrap: wrap; }

    .timestamp { font-size: 0.8rem; color: var(--text-dim); }

    @media (max-width: 1024px) {
      .charts-row { grid-template-columns: 1fr; }
      .chart-card { height: 350px; }
    }

    @media (max-width: 900px) {
      .dashboard-header { flex-direction: column; align-items: stretch; }
      .header-actions { justify-content: space-between; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      body { padding: 20px 15px; }
      .login-container { padding: 35px 25px; }
      .dashboard-title { font-size: 1.6rem; }
      .stat-value { font-size: 1.8rem; }
      .stats-grid { grid-template-columns: 1fr; }
      td, th { padding: 12px 15px; font-size: 0.8rem; }
      .badge-desktop { display: none; }
      .header-actions { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
      .footer-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-container" id="loginContainer">
    <div class="login-icon"><i class="fas fa-lock"></i></div>
    <h1 class="login-title">Analytics Dashboard</h1>
    <p class="login-subtitle">Secure Access to Portfolio Insights</p>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Security Key</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="off">
      </div>
      <button type="submit" class="login-btn">Initialize Dashboard</button>
      <div class="error-message" id="errorMessage"><i class="fas fa-exclamation-circle"></i> Invalid Security Key</div>
    </form>
  </div>

  <!-- Dashboard -->
  <div class="dashboard-container" id="dashboardContainer">
    <div class="dashboard-header">
      <h1 class="dashboard-title"><i class="fas fa-chart-line"></i> Insights Dashboard</h1>
      <div class="header-actions">
        <a href="../index.html" class="btn btn-outline" title="View Live Site"><i class="fas fa-external-link-alt"></i> View Site</a>
        <button class="btn btn-outline" id="refreshBtn" title="Refresh Data"><i class="fas fa-sync"></i> Refresh</button>
        <button class="btn btn-danger" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-chart-area"></i> Sessions Over Time</div>
        <canvas id="sessionsChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-pie-chart"></i> Top Sections</div>
        <canvas id="sectionsChart"></canvas>
      </div>
    </div>

    <!-- Device Stats -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-mobile-alt"></i> Device Distribution</div>
        <canvas id="deviceChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title"><i class="fas fa-globe"></i> Browser Usage</div>
        <canvas id="browserChart"></canvas>
      </div>
    </div>

    <!-- Tables -->
    <div class="content-box">
      <div class="box-header"><i class="fas fa-list"></i> Recent Visitor Sessions</div>
      <div id="sessionsContent"></div>
    </div>

    <div class="footer-actions">
        <button class="btn btn-outline" id="exportBtn"><i class="fas fa-file-download"></i> Export JSON</button>
        <button class="btn btn-danger" id="clearBtn"><i class="fas fa-trash-alt"></i> Reset All Data</button>
    </div>
  </div>

  <script>
    const PASSWORD_HASH = 'f96afadd9e873579177e663960412deb9ecdfba489c8e8d20c2a6db947fb9de2'; // "curiousXZ"

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const loginContainer = document.getElementById('loginContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');
    
    let sessionsChart = null;
    let sectionsChart = null;
    let deviceChart = null;
    let browserChart = null;

    function checkAuth() {
      if (sessionStorage.getItem('analytics-auth') === 'authenticated') showDashboard();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const hash = await sha256(passwordInput.value);
      if (hash === PASSWORD_HASH) {
        sessionStorage.setItem('analytics-auth', 'authenticated');
        showDashboard();
      } else {
        errorMessage.classList.add('show');
        passwordInput.value = '';
        setTimeout(() => errorMessage.classList.remove('show'), 3000);
      }
    });

    function showDashboard() {
      loginContainer.classList.add('hidden');
      dashboardContainer.classList.add('visible');
      loadDashboard();
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('analytics-auth');
      window.location.reload();
    });

    function loadDashboard() {
      const allSessions = JSON.parse(localStorage.getItem('analytics-sessions') || '[]');
      
      if (allSessions.length === 0) {
        document.getElementById('statsGrid').innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-chart-bar"></i><p>Waiting for visitors...</p></div>';
        return;
      }

      // Stats
      const total = allSessions.length;
      const totalDuration = allSessions.reduce((sum, s) => sum + s.duration, 0);
      const totalViews = allSessions.reduce((sum, s) => sum + s.pageViews, 0);
      const totalInteractions = allSessions.reduce((sum, s) => sum + s.interactions, 0);
      const avgDuration = Math.round(totalDuration / total);
      const avgViews = Math.round(totalViews / total);

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-users"></i> Total Visits</div>
          <div class="stat-value">${total}</div>
          <div class="stat-change">+${Math.floor(Math.random() * 5) + 1} today</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-eye"></i> Total Views</div>
          <div class="stat-value">${totalViews}</div>
          <div class="stat-change">Avg ${avgViews} per session</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-clock"></i> Avg Duration</div>
          <div class="stat-value">${avgDuration}s</div>
          <div class="stat-change">Total ${Math.round(totalDuration/60)}m</div>
        </div>
        <div class="stat-card">
          <div class="stat-label"><i class="fas fa-mouse"></i> Interactions</div>
          <div class="stat-value">${totalInteractions}</div>
          <div class="stat-change">Avg ${Math.round(totalInteractions/total)} per visit</div>
        </div>
      `;

      // Table
      const tableHTML = `
        <table>
          <thead><tr><th>Session ID</th><th class="badge-desktop">Platform</th><th>Duration</th><th>Views</th><th>Interactions</th><th>Time</th></tr></thead>
          <tbody>
            ${allSessions.slice(-15).reverse().map(s => `
              <tr>
                <td title="${s.sessionId}"><code style="color:var(--accent); font-size:0.8rem;">${s.sessionId.substring(0,10)}</code></td>
                <td class="badge-desktop"><span class="badge badge-warning">${s.deviceInfo.platform.split(' ')[0]}</span></td>
                <td><span class="badge">${s.duration}s</span></td>
                <td><span class="badge badge-success">${s.pageViews}</span></td>
                <td><span class="badge badge-purple">${s.interactions}</span></td>
                <td class="timestamp">${new Date(s.startTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('sessionsContent').innerHTML = tableHTML;

      renderCharts(allSessions);
    }

    function renderCharts(data) {
      const ctx1 = document.getElementById('sessionsChart').getContext('2d');
      const ctx2 = document.getElementById('sectionsChart').getContext('2d');
      const ctx3 = document.getElementById('deviceChart').getContext('2d');
      const ctx4 = document.getElementById('browserChart').getContext('2d');

      if (sessionsChart) sessionsChart.destroy();
      if (sectionsChart) sectionsChart.destroy();
      if (deviceChart) deviceChart.destroy();
      if (browserChart) browserChart.destroy();

      // Chart 1: Daily Sessions
      const dailyData = {};
      data.forEach(s => {
        const d = new Date(s.startTime).toLocaleDateString();
        dailyData[d] = (dailyData[d] || 0) + 1;
      });

      sessionsChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: Object.keys(dailyData),
          datasets: [{
            label: 'Visits',
            data: Object.values(dailyData),
            borderColor: '#00e5ff',
            backgroundColor: 'rgba(0, 229, 255, 0.1)',
            fill: true,
            tension: 0.4,
            pointBackgroundColor: '#00e5ff',
            pointBorderColor: '#070b1f',
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.5)' } },
            x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.5)' } }
          }
        }
      });

      // Chart 2: Section Popularity
      const sectionData = {};
      data.forEach(s => {
        (s.sectionsVisited || []).forEach(sec => {
          sectionData[sec] = (sectionData[sec] || 0) + 1;
        });
      });

      sectionsChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: Object.keys(sectionData),
          datasets: [{
            data: Object.values(sectionData),
            backgroundColor: ['#00e5ff', '#8b5cf6', '#f59e0b', '#22c55e', '#ff4444', '#ff00c1', '#3b82f6'],
            borderWidth: 2,
            borderColor: '#070b1f'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: 'rgba(255,255,255,0.7)', usePointStyle: true, padding: 15, font: { size: 11 } } }
          }
        }
      });

      // Chart 3: Device Distribution
      const deviceData = {};
      data.forEach(s => {
        const device = s.deviceInfo.platform.split(' ')[0];
        deviceData[device] = (deviceData[device] || 0) + 1;
      });

      deviceChart = new Chart(ctx3, {
        type: 'bar',
        data: {
          labels: Object.keys(deviceData),
          datasets: [{
            label: 'Visits',
            data: Object.values(deviceData),
            backgroundColor: ['#00e5ff', '#8b5cf6', '#f59e0b'],
            borderRadius: 8,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: 'rgba(255,255,255,0.5)' } },
            x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.5)' } }
          }
        }
      });

      // Chart 4: Browser Usage
      const browserData = {};
      data.forEach(s => {
        const browser = s.deviceInfo.browser || 'Unknown';
        browserData[browser] = (browserData[browser] || 0) + 1;
      });

      browserChart = new Chart(ctx4, {
        type: 'polarArea',
        data: {
          labels: Object.keys(browserData),
          datasets: [{
            data: Object.values(browserData),
            backgroundColor: ['rgba(0, 229, 255, 0.7)', 'rgba(139, 92, 246, 0.7)', 'rgba(245, 158, 11, 0.7)', 'rgba(34, 197, 94, 0.7)'],
            borderColor: ['#00e5ff', '#8b5cf6', '#f59e0b', '#22c55e'],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: 'rgba(255,255,255,0.7)', usePointStyle: true, padding: 15, font: { size: 11 } } }
          }
        }
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadDashboard();
      document.getElementById('refreshBtn').innerHTML = '<i class="fas fa-check"></i> Refreshed';
      setTimeout(() => {
        document.getElementById('refreshBtn').innerHTML = '<i class="fas fa-sync"></i> Refresh';
      }, 2000);
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        const data = localStorage.getItem('analytics-sessions') || '[]';
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `analytics-${new Date().toISOString().split('T')[0]}.json`; a.click();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        if(confirm('⚠️ Delete all analytics data? This cannot be undone.')) { 
          localStorage.removeItem('analytics-sessions'); 
          loadDashboard(); 
        }
    });

    checkAuth();
  </script>
</body>
</html>
